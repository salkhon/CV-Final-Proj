# Conda environment for the CV final project.
#
# The course handout pins Python 3.8.8 and PyTorch 1.10 for Linux (TA machines).
# On Apple Silicon (osx-arm64), those exact conda builds are often missing.
# This file uses a supported Python and installs PyTorch via pip (wheels for
# arm64 and linux) so `conda env create -f cv_proj.yml` works locally.
# The project code uses standard PyTorch/torchvision APIs and remains compatible.
#
# Pip torch/torchvision: 2.7+ for API compatibility and (on Linux) easier upgrade to
# CUDA 12.8 wheels for RTX 50-series (sm_120). Conda may pull NumPy 2.x; many torch builds
# still expect NumPy 1.x — pin NumPy<2 unless you verify your stack supports NumPy 2.
#
# Linux + NVIDIA Blackwell (RTX 5080/5090): after env create, run:
#   bash scripts/upgrade_pytorch_cuda128.sh
# so pip replaces wheels with cu128 builds (sm_120 is not in old cu117 binaries).
#
# Optional: to mirror the old Linux stack under Rosetta, use an x86_64 Miniconda
# and you can try pinning python=3.8 and torch 1.10 from the pytorch channel.
name: cv_proj
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.21,<2
  - scipy>=1.7
  - h5py>=3.5
  - cython>=0.29
  - setuptools
  - scikit-learn>=1.3
  - pip:
    - torch==2.7.0
    - torchvision==0.22.0
    - opencv-python==4.5.4.58
    - matplotlib>=3.3.0
    - tqdm>=4.60.0
    - Pillow>=8.0.0
